[package]
name = "localmorph-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local, authenticated FFmpeg companion service for LocalMorph"

[dependencies]
axum = { version = "0.7", features = ["json", "multipart", "macros"] }
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
