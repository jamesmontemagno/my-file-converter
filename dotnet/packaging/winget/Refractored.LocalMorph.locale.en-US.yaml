ShortDescription: Convert video, audio, images, and documents locally with FFmpeg and other tools on your device.
Description: |-
  LocalMorph converts any number of files at once without uploading them anywhere. It drives
  FFmpeg (and optionally ImageMagick, LibreOffice, Pandoc, and Ghostscript) already installed on
  your PC to produce MP4, MKV, WebM, GIF, MP3, FLAC, Opus, WAV, PNG, JPEG, WebP, AVIF, PDF, DOCX,
  and more. Quick presets, trim and frame grab from a live preview, two-pass target file sizes,
  hardware encoding (NVENC, Quick Sync, AMF), and a history of everything you've made.
