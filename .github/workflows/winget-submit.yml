name: WinGet Submission

# Manually-gated submission of a published Windows release to microsoft/winget-pkgs. Run this
# AFTER reviewing the GitHub release. The full multi-file manifest is regenerated from
# dotnet/packaging/winget so the Dependencies block is always present.
#
# Requires repository secret WINGET_CREATE_GITHUB_TOKEN: a classic PAT (public_repo scope) from an
# account that can fork microsoft/winget-pkgs. See https://aka.ms/winget-create-token.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Windows release tag to submit (for example, v1.0.1-windows)'
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_FAMILY_NAME: Refractored.LocalMorph_vmshqmcyy894t

jobs:
  submit:
    name: Submit to winget-pkgs
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:\.(?<revision>\d+))?-windows$') {
            throw "Windows release tags must look like v1.2.3-windows or v1.2.3.4-windows. Got '$tag'."
          }
          $revision = if ($Matches.revision) { $Matches.revision } else { "0" }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$($Matches.base).$revision" >> $env:GITHUB_ENV
          "ASSET_VERSION=$(if ($Matches.revision) { "$($Matches.base).$revision" } else { $Matches.base })" >> $env:GITHUB_ENV

      - name: Download release MSIX packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          gh release download $env:RELEASE_TAG --repo ${{ github.repository }} `
            --pattern "LocalMorph-$env:ASSET_VERSION-x64.msix" --pattern "LocalMorph-$env:ASSET_VERSION-arm64.msix" --dir packages
          Get-ChildItem packages | Format-Table Name, Length

      - name: Generate winget manifest
        shell: pwsh
        run: |
          $manifestDir = "manifests"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          Copy-Item dotnet/packaging/winget/Refractored.LocalMorph.yaml $manifestDir
          Copy-Item dotnet/packaging/winget/Refractored.LocalMorph.locale.en-US.yaml $manifestDir
          foreach ($manifest in Get-ChildItem $manifestDir/*.yaml) {
            $content = Get-Content $manifest.FullName -Raw
            $content = $content -replace 'PackageVersion: .*', "PackageVersion: $env:PACKAGE_VERSION"
            $content = $content -replace 'ReleaseNotesUrl: .*', "ReleaseNotesUrl: https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
            Set-Content -Path $manifest.FullName -Value $content -Encoding UTF8
          }

          function Hash($path, $kind) {
            $args = if ($kind -eq 'sig') { @('hash', '--msix', $path) } else { @('hash', $path) }
            $key = if ($kind -eq 'sig') { 'SignatureSha256:' } else { 'InstallerSha256:' }
            (& winget @args | Select-String $key | Select-Object -Last 1).ToString().Split(':')[1].Trim()
          }
          $x64 = "packages/LocalMorph-$env:ASSET_VERSION-x64.msix"
          $arm64 = "packages/LocalMorph-$env:ASSET_VERSION-arm64.msix"

          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
          PackageIdentifier: Refractored.LocalMorph
          PackageVersion: $env:PACKAGE_VERSION
          MinimumOSVersion: 10.0.19041.0
          InstallerType: msix
          InstallModes:
            - silent
            - silentWithProgress
          PackageFamilyName: $env:PACKAGE_FAMILY_NAME
          Dependencies:
            PackageDependencies:
              - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
              - PackageIdentifier: Microsoft.WindowsAppRuntime.2
              - PackageIdentifier: Gyan.FFmpeg
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/LocalMorph-$env:ASSET_VERSION-x64.msix
              InstallerSha256: $(Hash $x64 inst)
              SignatureSha256: $(Hash $x64 sig)
            - Architecture: arm64
              InstallerUrl: https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/LocalMorph-$env:ASSET_VERSION-arm64.msix
              InstallerSha256: $(Hash $arm64 inst)
              SignatureSha256: $(Hash $arm64 sig)
          ManifestType: installer
          ManifestVersion: 1.12.0
          "@ | ForEach-Object { $_ -replace '^          ', '' } |
            Set-Content -Path (Join-Path $manifestDir "Refractored.LocalMorph.installer.yaml") -Encoding UTF8

          $validateOutput = winget validate --manifest $manifestDir 2>&1 | Out-String
          Write-Host $validateOutput
          if ($validateOutput -notmatch 'Manifest validation succeeded') { throw "winget validate failed:`n$validateOutput" }
          $global:LASTEXITCODE = 0

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "The WINGET_CREATE_GITHUB_TOKEN repository secret is not set. See https://aka.ms/winget-create-token."
          }
          curl.exe -JLO https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe submit --token $env:WINGET_CREATE_GITHUB_TOKEN manifests
