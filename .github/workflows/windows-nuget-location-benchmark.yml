name: Windows NuGet location benchmark

# Temporary branch-only pilot. Never run on main, PRs, releases, or self-hosted runners.
on:
  push:
    branches: ['jamesmontemagno-maui-nuget-location-benchmark']
    paths: ['.github/workflows/windows-nuget-location-benchmark.yml']

permissions:
  contents: read

jobs:
  location:
    if: github.repository == 'jamesmontemagno/my-file-converter' && github.run_number == 1 && github.run_attempt == 1
    name: cold-${{ matrix.location }}-${{ matrix.trial }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        location: [default, runner-temp]
        trial: [1, 2]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      WINDOWS_DOTNET_VERSION: '10.0.401'
      PILOT_LOCATION: ${{ matrix.location }}
      PILOT_TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record host and select cold NuGet locations
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'This pilot requires a disposable GitHub-hosted Windows runner.'
          }
          if ($env:NUGET_PACKAGES -or $env:NUGET_HTTP_CACHE_PATH) {
            throw 'An explicit NuGet storage override already exists; refusing to override another pilot.'
          }
          $packages = Join-Path $env:USERPROFILE '.nuget\packages'
          $http = Join-Path $env:LOCALAPPDATA 'NuGet\v3-cache'
          if ($env:PILOT_LOCATION -eq 'runner-temp') {
            $packages = Join-Path $env:RUNNER_TEMP 'nuget\packages'
            $http = Join-Path $env:RUNNER_TEMP 'nuget\http-cache'
            "NUGET_PACKAGES=$packages" >> $env:GITHUB_ENV
            "NUGET_HTTP_CACHE_PATH=$http" >> $env:GITHUB_ENV
          }
          foreach ($path in @($packages, $http)) {
            if ((Test-Path -LiteralPath $path) -and (Get-ChildItem -LiteralPath $path -Force | Select-Object -First 1)) {
              throw "Not a cold cache: $path. No existing cache will be deleted."
            }
          }
          $outputs = Get-ChildItem -LiteralPath dotnet -Directory -Recurse |
            Where-Object { $_.Name -in @('bin', 'obj') }
          if ($outputs) { throw 'Checkout already contains build outputs; cold trial is invalid.' }
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\localmorph-dotnet" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path benchmark-results | Out-Null
          $paths = [ordered]@{
            workspace = $env:GITHUB_WORKSPACE
            runnerTemp = $env:RUNNER_TEMP
            userProfile = $env:USERPROFILE
            sdk = "$env:RUNNER_TEMP\localmorph-dotnet"
            packages = $packages
            httpCache = $http
          }
          $volumes = foreach ($letter in ($paths.Values | ForEach-Object { [IO.Path]::GetPathRoot($_).Substring(0, 1) } | Sort-Object -Unique)) {
            $volume = Get-Volume -DriveLetter $letter -ErrorAction Stop
            $partition = Get-Partition -DriveLetter $letter -ErrorAction Stop
            $disk = Get-Disk -Number $partition.DiskNumber -ErrorAction Stop
            [ordered]@{
              drive = "$letter`:"
              fileSystem = $volume.FileSystem
              sizeBytes = $volume.Size
              diskNumber = $partition.DiskNumber
              diskModel = $disk.FriendlyName
              busType = "$($disk.BusType)"
            }
          }
          $metadata = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            location = $env:PILOT_LOCATION
            trial = $env:PILOT_TRIAL
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            architecture = $env:RUNNER_ARCHITECTURE
            cpu = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors)
            os = (Get-CimInstance Win32_OperatingSystem).Caption
            paths = $paths
            volumes = @($volumes)
            initialPackageEntries = 0
            initialHttpCacheEntries = 0
            remoteCache = 'disabled: cold vs cold; no restore, extraction, compression, or save'
            remoteCacheExtractSeconds = 0
            remoteCacheSaveSeconds = 0
            sdkVersion = '10.0.401'
            workloadVersion = '10.0.401.1'
          }
          $metadata | ConvertTo-Json -Depth 8 |
            Tee-Object -FilePath benchmark-results\metadata.json
      - name: Install isolated pinned SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.WINDOWS_DOTNET_VERSION }}
      - name: Select and verify pinned file-based SDK
        run: |
          @{ sdk = @{ version = $env:WINDOWS_DOTNET_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content -LiteralPath global.json -Encoding utf8
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:WINDOWS_DOTNET_VERSION) { throw "Unexpected Windows SDK: $actual" }
          $expected = Join-Path $env:DOTNET_INSTALL_DIR 'dotnet.exe'
          $resolved = (Get-Command dotnet | Select-Object -First 1).Source
          if ($resolved -ne $expected) { throw "Expected isolated SDK $expected; resolved $resolved." }
          $msi = Join-Path $env:DOTNET_INSTALL_DIR 'metadata\workloads\10.0.400\installertype\msi'
          if (Test-Path -LiteralPath $msi) { throw 'Expected file-based installation, not MSI state.' }
          dotnet nuget locals all --list | Tee-Object -FilePath benchmark-results\nuget-paths.txt
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve NuGet paths.' }
          $metadata = Get-Content benchmark-results\metadata.json -Raw | ConvertFrom-Json
          foreach ($path in @($metadata.paths.packages, $metadata.paths.httpCache)) {
            if (-not (Select-String -LiteralPath benchmark-results\nuget-paths.txt -SimpleMatch $path -Quiet)) {
              throw "NuGet did not resolve the expected path: $path"
            }
          }
          dotnet --info
      - name: Install pinned Windows MAUI workload
        run: |
          dotnet workload install maui-windows --version 10.0.401.1
          if ($LASTEXITCODE -ne 0) { throw 'MAUI workload installation failed.' }
          $workload = dotnet workload --version
          if ($LASTEXITCODE -ne 0 -or $workload -ne '10.0.401.1') { throw "Unexpected workload set: $workload" }
          dotnet workload list
      - name: Restore Windows desktop
        run: |
          dotnet restore dotnet\src\LocalMorph.App\LocalMorph.App.csproj -p:WindowsOnly=true -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop restore failed.' }
      - name: Build Windows desktop without restore
        run: |
          dotnet build dotnet\src\LocalMorph.App\LocalMorph.App.csproj -f net10.0-windows10.0.19041.0 --configuration Release -p:WindowsOnly=true --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
      - name: Install FFmpeg for representative tests
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable.' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe is unavailable.' }
      - name: Restore representative tests
        run: |
          foreach ($project in @('LocalMorph.Bridge.Tests', 'LocalMorph.Core.Tests')) {
            dotnet restore "dotnet\tests\$project\$project.csproj" -p:Configuration=Release
            if ($LASTEXITCODE -ne 0) { throw "$project restore failed." }
          }
      - name: Build representative tests without restore
        run: |
          foreach ($project in @('LocalMorph.Bridge.Tests', 'LocalMorph.Core.Tests')) {
            dotnet build "dotnet\tests\$project\$project.csproj" --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "$project build failed." }
          }
      - name: Run representative tests without build or restore
        run: |
          foreach ($project in @('LocalMorph.Bridge.Tests', 'LocalMorph.Core.Tests')) {
            dotnet test "dotnet\tests\$project\$project.csproj" --configuration Release --no-build --no-restore --logger "trx;LogFileName=$project.trx" --results-directory benchmark-results
            if ($LASTEXITCODE -ne 0) { throw "$project tests failed." }
          }
      - name: Test Store helpers and provenance guards
        run: .\scripts\windows\Test-StoreScripts.ps1
      - name: Compile x64 and ARM64 Explorer commands and verify symbols
        run: |
          . .\scripts\windows\Store-Functions.ps1
          .\scripts\windows\Build-Shell.ps1 -Architecture x64 -OutputDirectory artifacts\native-shell\x64
          Assert-PdbMatchesBinary -Binary artifacts\native-shell\x64\LocalMorph.Shell.dll -Pdb artifacts\native-shell\x64\LocalMorph.Shell.pdb
          .\scripts\windows\Build-Shell.ps1 -Architecture ARM64 -OutputDirectory artifacts\native-shell\ARM64
          Assert-PdbMatchesBinary -Binary artifacts\native-shell\ARM64\LocalMorph.Shell.dll -Pdb artifacts\native-shell\ARM64\LocalMorph.Shell.pdb
      - name: Upload benchmark metadata and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-location-${{ matrix.location }}-${{ matrix.trial }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 14
