name: Publish LocalMorph Bridge

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish NuGet tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version must be a canonical NuGet SemVer value, for example 0.1.0 or 0.2.0-preview.1." >&2
            exit 1
          fi
      - name: Test bridge
        env:
          EXPECTED_BRIDGE_VERSION: ${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: dotnet test dotnet/LocalMorph.Bridge.sln --configuration Release -p:Version="$VERSION"
      - name: Pack bridge
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet pack dotnet/src/LocalMorph.Bridge/LocalMorph.Bridge.csproj \
            --configuration Release \
            --no-build \
            --output release \
            -p:PackageVersion="$VERSION"
      - name: Get temporary NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: jamesmontemagno
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          dotnet nuget push "release/LocalMorph.Bridge.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          PACKAGE="release/LocalMorph.Bridge.$VERSION.nupkg"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--title "LocalMorph Bridge $TAG" --generate-notes)
            if [[ "$VERSION" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" "$PACKAGE"
