name: Windows Store Publish

on:
  push:
    tags:
      - 'v*-windows'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact Windows release tag; required for package/publish, ignored for diagnostics'
        type: string
        required: false
      mode:
        description: 'Package never submits. Diagnose is read-only. Publish gates Internal Testing, then production.'
        type: choice
        options: [package, diagnose, publish]
        default: package
        required: true
      replace_flight_draft:
        description: 'Publish only: discard an unsubmitted portal-created Internal Testing draft (keeps flight/testers)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-store-publish
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  package:
    name: Build and verify Store upload
    if: github.event_name == 'push' || inputs.mode != 'diagnose'
    runs-on: windows-latest
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      WINDOWS_DOTNET_VERSION: '10.0.401'
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact tag and Store version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          . .\scripts\windows\Store-Functions.ps1
          $version = Get-StoreVersion $env:RELEASE_TAG
          $tagCommit = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist.' }
          $head = git rev-parse HEAD
          if ($head -ne $tagCommit) { throw 'Checkout does not match the requested tag commit.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_commit=$head" >> $env:GITHUB_OUTPUT
      - name: Initialize Windows NuGet caches
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: .\scripts\windows\Initialize-NuGetCache.ps1
      - name: Initialize isolated Windows SDK directory
        run: '"DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\localmorph-dotnet" >> $env:GITHUB_ENV'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.WINDOWS_DOTNET_VERSION }}
      - name: Select pinned Windows SDK
        run: |
          @{ sdk = @{ version = $env:WINDOWS_DOTNET_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content -LiteralPath global.json -Encoding utf8
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:WINDOWS_DOTNET_VERSION) { throw "Unexpected Windows SDK: $actual" }
          "Selected Windows SDK: $actual"
      - name: Cache Windows NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES || '~/.nuget/packages' }}
          key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-${{ hashFiles('dotnet/**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.config', '**/nuget.config') }}
          restore-keys: |
            nuget-v2-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-
      - name: Install Windows MAUI workload
        run: |
          $expected = Join-Path $env:DOTNET_INSTALL_DIR 'dotnet.exe'
          $resolved = (Get-Command dotnet | Select-Object -First 1).Source
          if ($resolved -ne $expected) { throw "Expected the isolated job-local SDK at $expected; resolved $resolved." }
          "Using isolated SDK: $resolved"
          $msi = Join-Path $env:DOTNET_INSTALL_DIR 'metadata\workloads\10.0.400\installertype\msi'
          if (Test-Path -LiteralPath $msi) { throw 'Expected file-based workload installation, not machine-wide MSI state.' }
          dotnet workload install maui-windows --version 10.0.401.1
          if ($LASTEXITCODE -ne 0) { throw 'MAUI workload installation failed.' }
          $workload = dotnet workload --version
          if ($LASTEXITCODE -ne 0 -or $workload -ne '10.0.401.1') { throw "Unexpected workload set: $workload" }
      - name: Describe Windows toolchain
        run: |
          dotnet --info
          dotnet workload list
          dotnet nuget locals all --list
      - name: Test packaging helpers
        run: .\scripts\windows\Test-StoreScripts.ps1
      - name: Build unsigned x64 and ARM64 Store upload with crash symbols
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MICROSOFT_STORE_IDENTITY_NAME: ${{ secrets.MICROSOFT_STORE_IDENTITY_NAME }}
          MICROSOFT_STORE_PUBLISHER: ${{ secrets.MICROSOFT_STORE_PUBLISHER }}
          MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
        run: .\scripts\windows\Build-Store.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v7
        with:
          name: windows-store-package
          path: artifacts/store/LocalMorph-*.msixupload
          if-no-files-found: error

  diagnose:
    name: Read-only Partner Center diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose'
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify required approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\windows\Test-StoreApproval.ps1 -AllowSelfReview
      - name: Check authentication, application access and Internal Testing without creating a draft
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $flightId = .\scripts\windows\Test-PartnerCenter.ps1 -FlightName 'Internal Testing'
          "Read-only diagnostics resolved Internal Testing flight: $flightId. No draft or submission was changed." >> $env:GITHUB_STEP_SUMMARY

  flight:
    name: Approve and submit Internal Testing flight
    needs: package
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: windows-latest
    environment: microsoft-store
    outputs:
      flight_id: ${{ steps.flight.outputs.flight_id }}
      upload_sha256: ${{ steps.upload.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify required approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\windows\Test-StoreApproval.ps1 -AllowSelfReview
      - uses: actions/download-artifact@v8
        with:
          name: windows-store-package
          path: artifacts/store
      - name: Revalidate the downloaded upload
        id: upload
        env:
          IDENTITY_NAME: ${{ secrets.MICROSOFT_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ secrets.MICROSOFT_STORE_PUBLISHER }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          SOURCE_COMMIT: ${{ needs.package.outputs.source_commit }}
        run: |
          $uploads = @(Get-ChildItem artifacts\store -File -Filter *.msixupload)
          if ($uploads.Count -ne 1) { throw 'Expected exactly one Store upload artifact.' }
          .\scripts\windows\Test-StoreUpload.ps1 -Upload $uploads[0].FullName -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -Version $env:PACKAGE_VERSION -SourceCommit $env:SOURCE_COMMIT
          "sha256=$((Get-FileHash -LiteralPath $uploads[0].FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
      - name: Prepare API-managed Internal Testing flight
        id: flight
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          MICROSOFT_STORE_FLIGHT_GROUP_IDS: ${{ vars.MICROSOFT_STORE_FLIGHT_GROUP_IDS }}
          REPLACE_FLIGHT_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.replace_flight_draft }}
        run: |
          $flightId = .\scripts\windows\Test-PartnerCenter.ps1 -FlightName 'Internal Testing' -PrepareFlight -ReplaceFlightDraft:($env:REPLACE_FLIGHT_DRAFT -eq 'true')
          "flight_id=$flightId" >> $env:GITHUB_OUTPUT
      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Configure Microsoft Store Developer CLI
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:PARTNER_CENTER_TENANT_ID --sellerId $env:PARTNER_CENTER_SELLER_ID --clientId $env:PARTNER_CENTER_CLIENT_ID --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI configuration failed.' }
      - name: Submit the approved package to Internal Testing only
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
          FLIGHT_ID: ${{ steps.flight.outputs.flight_id }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          SOURCE_COMMIT: ${{ needs.package.outputs.source_commit }}
          UPLOAD_SHA256: ${{ steps.upload.outputs.sha256 }}
        run: |
          $uploads = @(Get-ChildItem artifacts\store -File -Filter *.msixupload)
          if ($uploads.Count -ne 1) { throw 'Expected exactly one Store upload artifact.' }
          if ([string]::IsNullOrWhiteSpace($env:FLIGHT_ID)) { throw 'Internal Testing flight ID was not resolved; refusing to submit.' }
          msstore publish $uploads[0].FullName --appId $env:MICROSOFT_STORE_PRODUCT_ID --flightId $env:FLIGHT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Internal Testing flight submission failed. Production is blocked.' }
          @(
            '## Internal Testing flight submitted'
            "- Flight ID: $env:FLIGHT_ID"
            "- Package version: $env:PACKAGE_VERSION"
            "- Source commit: $env:SOURCE_COMMIT"
            "- Upload SHA256: $env:UPLOAD_SHA256"
            ''
            'Before approving production, confirm this flight is published in Partner Center, install it as a tester, and complete the release checks. Submission success is not certification or Store availability.'
          ) >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Approve and submit tested upload to production
    needs: [package, flight]
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify required approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\windows\Test-StoreApproval.ps1 -AllowSelfReview
      - uses: actions/download-artifact@v8
        with:
          name: windows-store-package
          path: artifacts/store
      - name: Revalidate the exact upload submitted to Internal Testing
        env:
          IDENTITY_NAME: ${{ secrets.MICROSOFT_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ secrets.MICROSOFT_STORE_PUBLISHER }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          SOURCE_COMMIT: ${{ needs.package.outputs.source_commit }}
          FLIGHT_UPLOAD_SHA256: ${{ needs.flight.outputs.upload_sha256 }}
        run: |
          $uploads = @(Get-ChildItem artifacts\store -File -Filter *.msixupload)
          if ($uploads.Count -ne 1) { throw 'Expected exactly one Store upload artifact.' }
          .\scripts\windows\Test-StoreUpload.ps1 -Upload $uploads[0].FullName -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -Version $env:PACKAGE_VERSION -SourceCommit $env:SOURCE_COMMIT
          if ([string]::IsNullOrWhiteSpace($env:FLIGHT_UPLOAD_SHA256) -or (Get-FileHash -LiteralPath $uploads[0].FullName -Algorithm SHA256).Hash -ne $env:FLIGHT_UPLOAD_SHA256) { throw 'Production upload does not match the Internal Testing upload.' }
      - name: Check Partner Center access
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: .\scripts\windows\Test-PartnerCenter.ps1
      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Configure Microsoft Store Developer CLI
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:PARTNER_CENTER_TENANT_ID --sellerId $env:PARTNER_CENTER_SELLER_ID --clientId $env:PARTNER_CENTER_CLIENT_ID --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI configuration failed.' }
      - name: Submit the approved package to the main listing
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
        run: |
          $uploads = @(Get-ChildItem artifacts\store -File -Filter *.msixupload)
          if ($uploads.Count -ne 1) { throw 'Expected exactly one Store upload artifact.' }
          msstore publish $uploads[0].FullName --appId $env:MICROSOFT_STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store submission failed.' }
