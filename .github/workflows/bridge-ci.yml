name: Bridge CI

on:
  push:
    branches: ['main']
    paths:
      - 'dotnet/**'
      - '!dotnet/**/*.md'
      - 'global.json'
      - 'NuGet.config'
      - 'nuget.config'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'scripts/ci_paths.py'
      - 'scripts/windows/**'
      - 'scripts/mac/**'
      - 'scripts/tests/**'
      - 'scripts/create-release-tags.*'
      - 'Casks/**'
      - 'public/appcast*.xml'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/bridge-release.yml'
      - '.github/workflows/windows-store-publish.yml'
      - '.github/workflows/mac-store-publish.yml'
      - '.github/workflows/mac-release.yml'
      - '.github/workflows/windows-release.yml'
      - '.github/workflows/winget-submit.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'dotnet/**'
      - '!dotnet/**/*.md'
      - 'global.json'
      - 'NuGet.config'
      - 'nuget.config'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'scripts/ci_paths.py'
      - 'scripts/windows/**'
      - 'scripts/mac/**'
      - 'scripts/tests/**'
      - 'scripts/create-release-tags.*'
      - 'Casks/**'
      - 'public/appcast*.xml'
      - '.github/workflows/bridge-ci.yml'
      - '.github/workflows/bridge-release.yml'
      - '.github/workflows/windows-store-publish.yml'
      - '.github/workflows/mac-store-publish.yml'
      - '.github/workflows/mac-release.yml'
      - '.github/workflows/windows-release.yml'
      - '.github/workflows/winget-submit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected desktop components
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.paths.outputs.distribution }}
      tests: ${{ steps.paths.outputs.tests }}
      windows: ${{ steps.paths.outputs.windows }}
      mac: ${{ steps.paths.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 scripts/ci_paths.py

  distribution:
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    name: Store-only distribution guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check real Mac release approval settings without Apple credentials
        if: github.repository == 'jamesmontemagno/my-file-converter'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mac/store_release.py approval

  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ runner.os == 'Windows' && '10.0.401' || '10.0.x' }}
      - name: Cache Windows NuGet packages
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-${{ hashFiles('dotnet/**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.config', '**/nuget.config') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: dotnet test dotnet/tests/LocalMorph.Bridge.Tests/LocalMorph.Bridge.Tests.csproj --configuration Release
      - run: dotnet test dotnet/tests/LocalMorph.Core.Tests/LocalMorph.Core.Tests.csproj --configuration Release
      - run: dotnet pack dotnet/src/LocalMorph.Bridge/LocalMorph.Bridge.csproj --configuration Release

  desktop-app:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Cache Windows NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-${{ hashFiles('dotnet/**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.config', '**/nuget.config') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-sdk10.0.401-workload10.0.401.1-
      - name: Install pinned Windows MAUI workload
        run: dotnet workload install maui-windows --version 10.0.401.1
      - name: Describe Windows toolchain
        run: |
          dotnet --info
          dotnet workload list
          dotnet nuget locals all --list
      - run: dotnet build dotnet/src/LocalMorph.App/LocalMorph.App.csproj -f net10.0-windows10.0.19041.0 --configuration Release -p:WindowsOnly=true
      - name: Test Store helpers
        shell: pwsh
        run: .\scripts\windows\Test-StoreScripts.ps1
      - name: Compile architecture-matched Explorer commands
        shell: pwsh
        run: |
          . .\scripts\windows\Store-Functions.ps1
          .\scripts\windows\Build-Shell.ps1 -Architecture x64 -OutputDirectory artifacts\native-shell\x64
          Assert-PdbMatchesBinary -Binary artifacts\native-shell\x64\LocalMorph.Shell.dll -Pdb artifacts\native-shell\x64\LocalMorph.Shell.pdb
          .\scripts\windows\Build-Shell.ps1 -Architecture ARM64 -OutputDirectory artifacts\native-shell\ARM64
          Assert-PdbMatchesBinary -Binary artifacts\native-shell\ARM64\LocalMorph.Shell.dll -Pdb artifacts\native-shell\ARM64\LocalMorph.Shell.pdb

  desktop-app-mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - run: dotnet workload install maui-maccatalyst --version 10.0.401.1
      - run: dotnet build dotnet/src/LocalMorph.App/LocalMorph.App.csproj -f net10.0-maccatalyst --configuration Release -p:MacOnly=true -p:EnableCodeSigning=false
      - name: Validate Release architecture, minimum OS and scenes
        run: python3 scripts/mac/validate_app.py "dotnet/src/LocalMorph.App/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph.app"
      - name: Compile isolated Mac Store workspace (not shipping or runtime evidence)
        run: dotnet build dotnet/src/LocalMorph.App/LocalMorph.App.csproj -f net10.0-maccatalyst -p:MacOnly=true -p:LocalMorphMacStoreBuild=true -p:EnableCodeSigning=false
      - name: Validate sandbox workspace architecture, minimum OS and scenes
        run: python3 scripts/mac/validate_app.py "dotnet/src/LocalMorph.App/bin/mac-store/Debug/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph Sandbox Workspace.app"
      - name: Reject unapproved Mac Store Release packaging
        run: |
          if dotnet msbuild dotnet/src/LocalMorph.App/LocalMorph.App.csproj -nologo \
            -t:ValidateMacStoreBuild -p:TargetFramework=net10.0-maccatalyst -p:MacOnly=true \
            -p:Configuration=Release -p:LocalMorphMacStoreBuild=true > "$RUNNER_TEMP/mac-store-guard.log" 2>&1; then
            echo "Unapproved Mac Store Release build was accepted." >&2
            exit 1
          fi
          grep -F "Mac Store Release packaging is blocked" "$RUNNER_TEMP/mac-store-guard.log"
      - name: Compile isolated sandbox proof (not runtime evidence)
        run: dotnet build dotnet/src/LocalMorph.App/LocalMorph.App.csproj -f net10.0-maccatalyst -p:MacOnly=true -p:LocalMorphMacSandboxProof=true -p:EnableCodeSigning=false
      - name: Validate sandbox proof architecture, minimum OS and scenes
        run: python3 scripts/mac/validate_app.py "dotnet/src/LocalMorph.App/bin/Debug/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph Sandbox Proof.app"
      - name: Build pinned source-only media with libass/zimg
        run: |
          mkdir -p artifacts/mac-proof
          curl --fail --location --retry 3 https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz -o artifacts/mac-proof/ffmpeg-9.0.2.tar.xz
          bash scripts/mac/build-proof-media.sh artifacts/mac-proof/ffmpeg-9.0.2.tar.xz artifacts/mac-proof/media arm64
      - name: Test Apple engine against source-built tools (not host FFmpeg)
        run: |
          export PATH="$PWD/artifacts/mac-proof/media/arm64/bin:$PATH"
          dotnet test dotnet/tests/LocalMorph.Core.Tests --configuration Release \
            --filter 'FullyQualifiedName~AppleEncoder|FullyQualifiedName~FfmpegEngineTests|FullyQualifiedName~FileAccessRegistryTests|FullyQualifiedName~BundledToolTests|FullyQualifiedName~QueueFileAccessTests|FullyQualifiedName~FileImportTests' \
            --logger 'trx;LogFileName=apple-encoders.trx' \
            --results-directory artifacts/mac-proof/tests
      - name: Build and stage Release Store beta without Store credentials
        run: |
          dotnet build dotnet/src/LocalMorph.App/LocalMorph.App.csproj -f net10.0-maccatalyst -c Release \
            -p:MacOnly=true -p:LocalMorphMacStoreBuild=true -p:LocalMorphMacStoreBetaRelease=true \
            "-p:LocalMorphMacStoreMediaDirectory=$PWD/artifacts/mac-proof/media/arm64" \
            -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false \
            -p:NoDSymUtil=false -p:DebugSymbols=true -p:DebugType=portable
          python3 scripts/mac/store_release.py stage \
            --app dotnet/src/LocalMorph.App/bin/mac-store/Release/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph.app \
            --media artifacts/mac-proof/media/arm64 --version 1.0.0 --build 1 \
            --source "$(git rev-parse HEAD)" --identity=-
      - name: Launch actual Release workspace in an isolated sandbox (light, dark and system)
        run: |
          python3 scripts/mac/smoke_sandbox.py \
            dotnet/src/LocalMorph.App/bin/mac-store/Release/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph.app \
            artifacts/mac-proof/workspace-startup --workspace
      - name: Ad-hoc sign isolated proof without Store credentials
        env:
          LOCALMORPH_PROOF_SIGNING_IDENTITY: '-'
        run: bash scripts/mac/prepare-sandbox-proof.sh artifacts/mac-proof/media artifacts/mac-proof/proof
      - name: Verify native scenes, sandbox, Apple encoders, hard cap and cancellation
        run: |
          python3 scripts/mac/smoke_sandbox.py \
            "artifacts/mac-proof/proof/app/Debug/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph Sandbox Proof.app" \
            artifacts/mac-proof/runtime
      - name: Preserve the exact signed app for minimum-OS testing
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "artifacts/mac-proof/proof/app/Debug/net10.0-maccatalyst/maccatalyst-arm64/LocalMorph Sandbox Proof.app" \
            artifacts/mac-proof/sandbox-app.zip
          (cd artifacts/mac-proof && shasum -a 256 sandbox-app.zip > sandbox-app.sha256)
          ditto -c -k --sequesterRsrc --keepParent \
            "artifacts/mac-proof/workspace-startup/LocalMorph Workspace Startup.app" \
            artifacts/mac-proof/workspace-app.zip
          (cd artifacts/mac-proof && shasum -a 256 workspace-app.zip > workspace-app.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: mac-sandbox-app
          path: |
            artifacts/mac-proof/sandbox-app.zip
            artifacts/mac-proof/sandbox-app.sha256
            artifacts/mac-proof/workspace-app.zip
            artifacts/mac-proof/workspace-app.sha256
            artifacts/mac-proof/ffmpeg-9.0.2.tar.xz
            artifacts/mac-proof/media/arm64/COPYING.LGPLv2.1
            artifacts/mac-proof/media/arm64/LICENSE.md
            artifacts/mac-proof/media/arm64/configure-flags.txt
            artifacts/mac-proof/media/arm64/source.txt
            artifacts/mac-proof/media/arm64/dependencies.txt
            artifacts/mac-proof/media/arm64/xcode.txt
            artifacts/mac-proof/media/arm64/licenses/
            artifacts/mac-proof/media/sources/
            artifacts/mac-proof/proof/proof-source/build-proof-media.sh
            artifacts/mac-proof/proof/proof-source/FFmpeg-proof-NOTICE.txt
      - name: Retain proof evidence (not Store certification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-sandbox-proof
          if-no-files-found: warn
          path: |
            artifacts/mac-proof/runtime/
            artifacts/mac-proof/workspace-startup/Light/
            artifacts/mac-proof/workspace-startup/Dark/
            artifacts/mac-proof/workspace-startup/Unspecified/
            artifacts/mac-proof/tests/
            artifacts/mac-proof/proof/proof-source/
            artifacts/mac-proof/proof/*.txt
            artifacts/mac-proof/proof/*.patch
            artifacts/mac-proof/proof/*.sha256
            artifacts/mac-proof/media/arm64/*.txt
            artifacts/mac-proof/media/arm64/*.log
            artifacts/mac-proof/media/arm64/*.sha256

  desktop-app-mac-baseline:
    name: Run the Xcode 27 proof on macOS 15
    needs: desktop-app-mac
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Assert the deployment-baseline host
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
          mkdir -p artifacts/mac-baseline
          sw_vers > artifacts/mac-baseline/system.txt
      - uses: actions/download-artifact@v8
        with:
          name: mac-sandbox-app
          path: artifacts/mac-baseline
      - name: Verify and run the same app without rebuilding
        run: |
          (cd artifacts/mac-baseline && shasum -a 256 -c sandbox-app.sha256)
          ditto -x -k artifacts/mac-baseline/sandbox-app.zip artifacts/mac-baseline/app
          APP="artifacts/mac-baseline/app/LocalMorph Sandbox Proof.app"
          codesign --verify --strict "$APP"
          codesign --verify --strict "$APP/Contents/MacOS/ffmpeg"
          codesign --verify --strict "$APP/Contents/MacOS/ffprobe"
          python3 scripts/mac/smoke_sandbox.py "$APP" artifacts/mac-baseline/runtime
      - name: Verify and launch the same Release workspace on the baseline (all themes)
        run: |
          (cd artifacts/mac-baseline && shasum -a 256 -c workspace-app.sha256)
          ditto -x -k artifacts/mac-baseline/workspace-app.zip artifacts/mac-baseline/workspace
          python3 scripts/mac/smoke_sandbox.py \
            "artifacts/mac-baseline/workspace/LocalMorph Workspace Startup.app" \
            artifacts/mac-baseline/workspace-runtime --workspace
      - name: Retain minimum-OS runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-sandbox-proof-macos15
          if-no-files-found: warn
          path: |
            artifacts/mac-baseline/system.txt
            artifacts/mac-baseline/sandbox-app.sha256
            artifacts/mac-baseline/runtime/
            artifacts/mac-baseline/workspace-app.sha256
            artifacts/mac-baseline/workspace-runtime/
