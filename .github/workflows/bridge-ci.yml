name: Bridge CI

on:
  push:
    paths:
      - 'dotnet/**'
      - 'README.md'
      - '.github/workflows/bridge-ci.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'README.md'
      - '.github/workflows/bridge-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test dotnet/LocalMorph.Bridge.sln --configuration Release
      - run: dotnet pack dotnet/src/LocalMorph.Bridge/LocalMorph.Bridge.csproj --configuration Release --no-build
